name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  bats:
    name: Bats unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run bats
        run: bats tests/

      - name: Check docs are up to date
        run: bash tools/gen-docs.sh --check
