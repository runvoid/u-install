name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  bats:
    name: Bats unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run bats
        run: bats tests/

      - name: Regenerate command reference data
        run: bash tools/gen-docs.sh

      - name: Check command data is in sync
        run: git diff --exit-code web/src/data/commands.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website (into docs/)
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Check docs/ build is committed and in sync
        run: git diff --exit-code docs
