# u-install configuration file
# Copy to ~/.config/u-install/u-install.conf to customize

[options]
# Number of parallel downloads for package sources
parallel_downloads = 3

# Directory where AUR packages are cloned and built
aur_build_dir = ~/.local/share/u-install/aur

# Automatically answer yes to prompts (use with caution)
auto_yes = false

# Default source preference: auto, native, nix, aur
prefer_source = auto

# Enable colored output
colors = true

# Log level: debug, info, warn, error
log_level = info

# Maximum parallel AUR builds during update
max_aur_builds_parallel = 2

# Remove AUR build files after successful installation
cleanup_after_build = false

# Nix channel to use
nix_channel = nixpkgs
