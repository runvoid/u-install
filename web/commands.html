      <h1>Commands</h1>
      <p class="lead">
        Every <code class="inline">u-&lt;verb&gt;</code> command supports <code class="inline">-y/--yes</code>,
        <code class="inline">-V/--version</code> and <code class="inline">-h/--help</code>.
        This reference is generated from each command&rsquo;s real <code class="inline">--help</code> output
        (CI keeps it in sync), so it can never go stale.
      </p>
